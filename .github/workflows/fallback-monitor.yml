name: Ray.i Fallback Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_fallback.py"
      - "data/watchlist.json"
      - ".github/workflows/fallback-monitor.yml"

permissions:
  contents: write

concurrency:
  group: rayi-fallback-monitor
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh public fallback data
        run: python scripts/update_fallback.py
      - name: Commit only changed snapshots
        run: |
          git config user.name "rayi-fallback-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/status.json data/fpl.json data/news.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: refresh fallback snapshot"
            git push
          fi
